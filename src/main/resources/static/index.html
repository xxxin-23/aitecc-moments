<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>科技社陪着你走过青葱校园</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 110'><ellipse cx='60' cy='62' rx='45' ry='38' fill='%23fff' stroke='%232b2b2b' stroke-width='5'/><path d='M27,31 Q22,8 33,10 Q45,13 50,25 Z' fill='%23fff' stroke='%232b2b2b' stroke-width='5'/><path d='M93,31 Q98,8 87,10 Q75,13 70,25 Z' fill='%23fff' stroke='%232b2b2b' stroke-width='5'/><path d='M86,22 Q71,6 68,15 Q68,26 86,22 Z' fill='%23ee334e'/><path d='M86,22 Q101,6 104,15 Q104,26 86,22 Z' fill='%23ee334e'/><circle cx='86' cy='22' r='6' fill='%23ee334e'/><ellipse cx='45' cy='62' rx='4' ry='7' fill='%232b2b2b'/><ellipse cx='75' cy='62' rx='4' ry='7' fill='%232b2b2b'/><ellipse cx='60' cy='73' rx='5' ry='3.6' fill='%23fcd133'/></svg>"
    />
  </head>
  <body>
    <!-- 图标精灵：Hello Kitty 同款小猫头 + 红蝴蝶结 + 爱心 + 小星星，页面里到处复用 -->
    <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-kitty" viewBox="0 0 120 112">
        <path
          d="M28,37 Q22,12 33,12 Q44,13 50,28 Z"
          fill="#fff"
          stroke="#2b2b2b"
          stroke-width="3"
          stroke-linejoin="round"
        />
        <path
          d="M92,37 Q98,12 87,12 Q76,13 70,28 Z"
          fill="#fff"
          stroke="#2b2b2b"
          stroke-width="3"
          stroke-linejoin="round"
        />
        <ellipse cx="60" cy="66" rx="44" ry="36" fill="#fff" stroke="#2b2b2b" stroke-width="3" />
        <path
          d="M84,26 Q66,10 64,20 Q64,32 84,26 Z"
          fill="#ee334e"
          stroke="#2b2b2b"
          stroke-width="2.6"
          stroke-linejoin="round"
        />
        <path
          d="M84,26 Q102,10 104,20 Q104,32 84,26 Z"
          fill="#ee334e"
          stroke="#2b2b2b"
          stroke-width="2.6"
          stroke-linejoin="round"
        />
        <circle cx="84" cy="26" r="6" fill="#ee334e" stroke="#2b2b2b" stroke-width="2.6" />
        <ellipse cx="44" cy="68" rx="4.2" ry="7" fill="#2b2b2b" />
        <ellipse cx="76" cy="68" rx="4.2" ry="7" fill="#2b2b2b" />
        <ellipse cx="60" cy="80" rx="5.2" ry="3.6" fill="#fcd133" stroke="#2b2b2b" stroke-width="1.8" />
        <path
          d="M14,58 L1,53 M13,68 L0,66 M15,78 L2,81"
          fill="none"
          stroke="#2b2b2b"
          stroke-width="2.4"
          stroke-linecap="round"
        />
        <path
          d="M106,58 L119,53 M107,68 L120,66 M105,78 L118,81"
          fill="none"
          stroke="#2b2b2b"
          stroke-width="2.4"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-bow" viewBox="0 0 40 26">
        <path
          d="M20,13 Q6,1 4,7 Q4,17 20,13 Z"
          fill="#ee334e"
          stroke="#2b2b2b"
          stroke-width="2.2"
          stroke-linejoin="round"
        />
        <path
          d="M20,13 Q34,1 36,7 Q36,17 20,13 Z"
          fill="#ee334e"
          stroke="#2b2b2b"
          stroke-width="2.2"
          stroke-linejoin="round"
        />
        <circle cx="20" cy="13" r="4.6" fill="#ee334e" stroke="#2b2b2b" stroke-width="2.2" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 22">
        <path
          d="M12,20 C4,14 1,10 1,6.6 C1,3.6 3.4,1.4 6.2,1.4 C8.2,1.4 10.4,2.6 12,5 C13.6,2.6 15.8,1.4 17.8,1.4 C20.6,1.4 23,3.6 23,6.6 C23,10 20,14 12,20 Z"
          fill="#ee334e"
        />
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 22">
        <path
          d="M12,1 L14.8,8.2 L22,8.2 L16.2,12.8 L18.4,20 L12,15.4 L5.6,20 L7.8,12.8 L2,8.2 L9.2,8.2 Z"
          fill="#fcd133"
        />
      </symbol>
    </svg>

    <!-- 背景装饰：飘着的小 Kitty、蝴蝶结、爱心和星星 -->
    <div class="deco" aria-hidden="true">
      <svg class="deco-item" viewBox="0 0 120 112"><use href="#i-kitty" /></svg>
      <svg class="deco-item bow" viewBox="0 0 40 26"><use href="#i-bow" /></svg>
      <svg class="deco-item heart" viewBox="0 0 24 22"><use href="#i-heart" /></svg>
      <svg class="deco-item" viewBox="0 0 120 112"><use href="#i-kitty" /></svg>
      <svg class="deco-item star" viewBox="0 0 24 22"><use href="#i-star" /></svg>
      <svg class="deco-item bow" viewBox="0 0 40 26"><use href="#i-bow" /></svg>
      <svg class="deco-item heart" viewBox="0 0 24 22"><use href="#i-heart" /></svg>
      <svg class="deco-item" viewBox="0 0 120 112"><use href="#i-kitty" /></svg>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="logo-wrap"><svg class="logo" viewBox="0 0 120 112"><use href="#i-kitty" /></svg></span>
        <div class="brand-text">
          <strong>科技社陪着你走过青葱校园</strong>
          <small>AITECC · 好吃好玩，一起分享</small>
        </div>
      </div>
      <div class="me" id="me"></div>
    </header>

    <nav class="tabs-bar">
      <button class="feed-tab active" data-tab="recommend">🌟 推荐</button>
      <button class="feed-tab" data-tab="latest">🕊️ 最新</button>
      <button class="feed-tab" data-tab="favorites">⭐ 我的收藏</button>
    </nav>

    <nav class="topics" id="topics"></nav>

    <main id="feed" class="feed"></main>

    <div id="loadMore" class="load-more hidden">
      <button id="loadMoreBtn">再看看别的 🎀</button>
    </div>

    <button class="fab" id="fab" title="发一条">＋</button>

    <!-- 别人发了新内容时冒出来的小提示条 -->
    <button class="new-tip hidden" id="newTip">
      ✨ 有 <b id="newTipCount">0</b> 条新动态，点击查看
    </button>

    <!-- 登录 / 注册 -->
    <div class="modal hidden" id="authModal">
      <div class="sheet">
        <div class="sheet-head">
          <h3 id="authTitle">登录</h3>
          <button class="icon-btn" data-close="authModal">✕</button>
        </div>
        <p class="hint">🎀 加入科技社小圈子，只需要一个昵称和密码，三秒钟就好</p>
        <div class="tabs">
          <button class="tab active" data-tab="login">登录</button>
          <button class="tab" data-tab="register">注册</button>
        </div>
        <label class="field">
          <span>昵称</span>
          <input id="authNickname" maxlength="24" placeholder="2~24 个字符，社团里认得出你就行" />
        </label>
        <label class="field" id="avatarRow">
          <span>头像 emoji</span>
          <input id="authAvatar" maxlength="4" placeholder="🙂" />
          <div class="emoji-pick" id="emojiPick"></div>
        </label>
        <label class="field">
          <span>密码</span>
          <input id="authPassword" type="password" maxlength="64" placeholder="至少 6 位" />
        </label>
        <p class="err" id="authError"></p>
        <button class="primary" id="authSubmit">登录</button>
      </div>
    </div>

    <!-- 个人资料：改昵称 / 头像 -->
    <div class="modal hidden" id="profileModal">
      <div class="sheet">
        <div class="sheet-head">
          <h3>我的资料</h3>
          <button class="icon-btn" data-close="profileModal">✕</button>
        </div>
        <div class="profile-top">
          <div class="avatar big" id="profileAvatar">🙂</div>
          <div class="profile-sum">
            <strong id="profileNickname">—</strong>
            <div class="profile-stats" id="profileStats"></div>
          </div>
        </div>
        <label class="field">
          <span>昵称（改了之后，你以前发的动态也会显示新名字）</span>
          <input id="profileName" maxlength="24" placeholder="2~24 个字符" />
        </label>
        <label class="field">
          <span>头像 emoji（点下面的小图标直接选）</span>
          <input id="profileAvatarInput" maxlength="4" placeholder="🙂" />
          <div class="emoji-pick" id="profileEmojiPick"></div>
        </label>
        <label class="field">
          <span>一句话简介（选填）</span>
          <input id="profileBio" maxlength="60" placeholder="比如：爱吃螺蛳粉的后端选手" />
        </label>
        <p class="err" id="profileError"></p>
        <button class="primary" id="profileSubmit">保存</button>
      </div>
    </div>

    <!-- 发布动态 -->
    <div class="modal hidden" id="composer">
      <div class="sheet">
        <div class="sheet-head">
          <h3 id="composerTitle">发一条</h3>
          <button class="icon-btn" data-close="composer">✕</button>
        </div>
        <textarea
          id="postContent"
          maxlength="2000"
          rows="4"
          placeholder="今天吃到什么好吃的、发现哪里好玩？说两句…"
        ></textarea>
        <div class="grid" id="imgPreview"></div>
        <div class="toolbar">
          <button class="chip-btn" id="pickImg">🖼️ 图片</button>
          <button class="chip-btn" id="pickLoc">📍 定位</button>
          <select id="topicSel" class="chip-btn"></select>
          <span class="grow"></span>
          <span class="loc-hint" id="locHint"></span>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <p class="hint">最多 9 张图，单张不超过 10MB；不发图也可以，写点什么就行 ✨</p>
        <p class="err" id="postError"></p>
        <button class="primary" id="postSubmit">发布</button>
      </div>
    </div>

    <!-- 动态详情（评论） -->
    <div class="modal hidden" id="detail">
      <div class="sheet">
        <div class="sheet-head">
          <h3>详情</h3>
          <button class="icon-btn" data-close="detail">✕</button>
        </div>
        <div id="detailBody" class="detail-body"></div>
        <div class="comment-bar">
          <input id="commentInput" maxlength="500" placeholder="说点什么…" />
          <button class="primary small" id="commentSend">发送</button>
        </div>
      </div>
    </div>

    <!-- 图片放大 -->
    <div class="lightbox hidden" id="lightbox">
      <img id="lightboxImg" alt="" />
    </div>

    <div class="toast hidden" id="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
